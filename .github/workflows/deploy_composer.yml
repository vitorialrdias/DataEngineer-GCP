name: Deploy to Composer

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'dags/**'
      - 'extract/**'
      - 'dbt/**'
      - '.github/workflows/**'
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1077263027522/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: techcommerce-ci@dataengineer-gcp-510313.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy DAGs
        run: |
          gcloud composer environments storage dags import \
            --environment=techcommerce-dev --location=us-east1 --project=dataengineer-gcp-510313 \
            --source=dags/techcommerce_daily_pipeline.py
          gcloud composer environments storage dags import \
            --environment=techcommerce-dev --location=us-east1 --project=dataengineer-gcp-510313 \
            --source=extract --destination=extract

      - name: Deploy dbt project
        run: |
          gcloud composer environments storage data import \
            --environment=techcommerce-dev --location=us-east1 --project=dataengineer-gcp-510313 \
            --source=dbt